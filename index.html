<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서울대학교 3D 캠퍼스</title>
  <meta name="description" content="관악캠퍼스의 건물 윤곽과 1동부터 15동까지 사진 기반 외관 추정 모형을 둘러보는 지도">
  <meta name="theme-color" content="#e4e3df">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23353a35'/%3E%3Cpath d='M9 30V15l11-6 11 6v15H9m11-21v21M9 21h22' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=20261117-d">
  <script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script>
</head>
<body>
  <main class="app">
    <aside class="sidebar" id="sidebar" aria-label="건물 찾기">
      <header class="sheet-header mobile-only"><button id="close-list" class="icon-button mobile-only" aria-label="건물 목록 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="search" type="search" placeholder="건물 번호 또는 이름" aria-label="건물 번호 또는 이름" autocomplete="off" spellcheck="false">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <button type="button" id="clear-search" class="search-clear" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </label>
      <div class="segments scope" role="group" aria-label="건물 표시 범위"><button data-scope="all" aria-pressed="true" class="active">전체 캠퍼스</button><button data-scope="review" aria-pressed="false">사진 기반 모델</button></div>
      <div class="list-heading"><span id="result-count" aria-live="polite"></span></div>
      <div class="building-list" id="building-list" role="group" aria-label="건물 목록">
        <div class="list-skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <section class="workspace" aria-label="캠퍼스 지도">
      <div class="toolbar">
        <button class="icon-button mobile-only" id="open-list" aria-label="건물 목록 열기" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <div class="segments view" role="group" aria-label="지도 보기"><button data-view="2d" aria-pressed="false">2D 지도</button><button data-view="3d" aria-pressed="true" class="active">3D 모형</button></div>
        <label class="detail-toggle"><input id="detail-toggle" class="switch" type="checkbox" role="switch" checked><span>상세 모델</span></label>
      </div>
      <div class="map-stage" id="map-stage">
        <div id="map" aria-label="건물을 클릭해 선택할 수 있는 3D 지도"></div>
        <div id="labels" aria-hidden="true"></div>
        <div id="loading" role="status"><div class="loading-card"><span class="loader"></span><div><strong>캠퍼스를 불러오는 중</strong><span>건물과 지도를 준비하고 있습니다.</span></div></div></div>
        <div id="map-error" hidden role="alert"></div>
        <aside class="inspector" id="inspector" hidden aria-label="선택한 건물 정보"></aside>
        <div class="map-legend"><span><i class="legend-base"></i>기본 모형</span><span><i class="legend-detail"></i>상세 모델</span><span><i class="legend-schematic"></i>윤곽 미확인</span></div>
        <div class="map-controls">
          <button id="north" data-tip="북쪽 정렬" aria-label="북쪽 정렬"><b>N</b><svg viewBox="0 0 28 32" aria-hidden="true"><path d="M14 3 24 28 14 23 4 28Z" fill="currentColor" stroke="none"/></svg></button>
          <div class="zoom-controls"><button id="zoom-in" data-tip="확대" aria-label="확대"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="zoom-out" data-tip="축소" aria-label="축소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button></div>
          <button id="reset-view" data-tip="전체 캠퍼스 보기" aria-label="전체 캠퍼스 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
        </div>
        <div class="map-bottom"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap contributors</a></div>
        <div class="scale"><span id="scale-label">100 m</span><div id="scale-bar"></div></div>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js?v=20261117-d"></script>
</body>
</html>
