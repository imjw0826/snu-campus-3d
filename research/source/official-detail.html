			if(!localStorage.getItem("lang")){
				localStorage.setItem("lang", "kor");
				$('.lang').html("English");
				$('.lang').attr('id','kor');
			}else if(localStorage.getItem("lang") == "kor"){
				$('.lang').html("English");
				$('.lang').attr('id','kor');
			}else if(localStorage.getItem("lang") == "eng"){
				$('.lang').html("Korean");
				$('.lang').attr('id','eng');
			}
			$('.lang').click(function(){
				var targetId = $(this).attr('id');
				if(targetId == 'eng'){
					localStorage.setItem("lang", "kor");
					$('.lang').attr('id','kor');

					localStorage.setItem("lang", "eng");
					$('.lang').attr('id','eng');
					$('.lang').html("Korean");
				}

			});
		});

	};


</script>

			  n = n.toString();
