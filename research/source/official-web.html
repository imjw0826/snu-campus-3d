		$(document).ready(function () {
			if(!localStorage.getItem("lang")){
				localStorage.setItem("lang", "kor");
				$('.lang').html("English");
				$('.lang').attr('id','kor');
			}else if(localStorage.getItem("lang") == "kor"){
				$('.lang').html("English");
				$('.lang').attr('id','kor');
			}else if(localStorage.getItem("lang") == "eng"){
				$('.lang').html("Korean");
				$('.lang').attr('id','eng');
			}
			$('.lang').click(function(){
				var targetId = $(this).attr('id');
				if(targetId == 'eng'){
					localStorage.setItem("lang", "kor");
					$('.lang').attr('id','kor');
					$('.lang').html("English");
				}else if(targetId == 'kor'){
					localStorage.setItem("lang", "eng");
					$('.lang').attr('id','eng');
					$('.lang').html("Korean");
				}
				location.reload();
			});
		});
		var langType = localStorage.getItem("lang");
		 //]]>
	};


</script>
